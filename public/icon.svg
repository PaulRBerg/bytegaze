  <line stroke="url(#gradient)" stroke-width="2" x1="44" x2="56" y1="32" y2="32" />
  <line stroke="url(#gradient)" stroke-width="2" x1="12" x2="20" y1="22" y2="26" />
  <line stroke="url(#gradient)" stroke-width="2" x1="12" x2="20" y1="42" y2="38" />
  <line stroke="url(#gradient)" stroke-width="2" x1="52" x2="44" y1="22" y2="26" />
  <line stroke="url(#gradient)" stroke-width="2" x1="52" x2="44" y1="42" y2="38" />
